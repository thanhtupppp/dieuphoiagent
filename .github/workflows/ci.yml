name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check core ui tests

      - name: Ruff format check
        run: uv run ruff format --check core ui tests

      - name: Mypy
        run: uv run mypy core/

      - name: Tests with coverage
        run: uv run pytest --cov=core --cov-report=term-missing --cov-fail-under=70
