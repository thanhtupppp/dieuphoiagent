repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (core + ui)
        entry: uv run mypy core ui
        language: system
        pass_filenames: false
        require_serial: true
