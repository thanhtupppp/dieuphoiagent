[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dieuphoiagent"
version = "0.1.0"
description = "AI Agent Browser Orchestrator"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=1.4.0",
    "playwright>=1.40.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "httpx>=0.27",
    "openai>=1.50",
]

[project.scripts]
dieuphoiagent = "run:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6.9",
    "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "ui"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC"]
ignore = ["E501", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "live: test chạy CDP trên trình duyệt thật (bỏ qua trong CI)",
]
addopts = "-m 'not live'"
